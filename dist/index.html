<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203e36"><meta name="description" content="Raise your banner. Capture the frontier. A single-player fantasy strategy game."><title>Node Based Warfare</title><style>/* Art direction + layout knobs. Numeric fonts are individually replaceable. */
:root  {
  --ink: #203c34;
  --panel: #203e36;
  --panel-deep: #172f29;
  --paper: #e9e1c9;
  --cream: #f4efdf;
  --gold: #d6b879;
  --muted: #a5b5a7;
  --line: #ffffff20;
  --danger: #c66b58;
  --selected: #68b8ee;
  --recipient: #d65c4c;
  --font-body: 'Segoe UI', sans-serif;
  --font-heading: Georgia, 'Times New Roman', serif;
  --font-army: 'Trebuchet MS', sans-serif;
  --font-hp: 'Segoe UI', sans-serif;
  --font-gold: Georgia, serif;
  --font-rate: 'Segoe UI', sans-serif;
  --font-tier: Georgia, serif;
  --font-time: Consolas, monospace;
  --sidebar-width: 280px;
  --hud-height: 78px;
  --deck-height: 184px;
  --button-radius: 4px;
  --button-height: 38px;
  --button-font-size: 12px;
  --node-radius: 29px;
}
.stat-army  {
  font-family: var(--font-army);
  color: #d9ede4;
}
.stat-hp  {
  font-family: var(--font-hp);
  color: #a8cdde;
}
.stat-gold  {
  font-family: var(--font-gold);
  color: var(--gold);
}
.stat-rate  {
  font-family: var(--font-rate);
  color: #b7c5a6;
}
.stat-tier  {
  font-family: var(--font-tier);
}
.stat-time  {
  font-family: var(--font-time);
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--panel-deep);
  color:var(--cream);
  font-family:var(--font-body);
  font-size:13px
}
button,input,select {
  font:inherit
}
button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:var(--button-height);
  padding:8px 13px;
  border:1px solid #b1bca640;
  border-radius:var(--button-radius);
  background:#ffffff06;
  color:inherit;
  font-size:var(--button-font-size);
  cursor:pointer;
  transition:background .15s,border-color .15s
}
button:hover:not(:disabled) {
  background:#d6b87920;
  border-color:var(--gold)
}
button:disabled {
  opacity:.4;
  cursor:not-allowed
}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible {
  outline:2px solid var(--selected);
  outline-offset:3px
}
button.primary {
  background:var(--gold);
  color:#233a30;
  border-color:var(--gold);
  font-weight:700
}
button.primary:hover:not(:disabled) {
  background:#e8cd93
}
button.primary .icon {
  filter:brightness(.28)
}
.icon {
  width:22px;
  height:22px;
  object-fit:contain;
  flex-shrink:0;
  pointer-events:none
}
h1,h2,h3,p {
  margin:0
}
h1,h2,h3 {
  font-family:var(--font-heading);
  font-weight:400
}
h2 {
  font-size:26px
}
small {
  font-size:10px
}
em {
  font-style:normal
}
i {
  font-style:normal
}
.eyebrow {
  font-size:9px;
  letter-spacing:2px;
  font-weight:600;
  color:var(--gold)
}
.section-label {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:9px;
  font-weight:600;
  letter-spacing:1.5px;
  color:var(--muted);
  margin-bottom:12px
}
.section-label em {
  font-size:8px;
  letter-spacing:.1px;
  color:var(--gold);
  margin-left:auto
}
.section-label>span {
  color:var(--gold)
}
.hud {
  height:var(--hud-height);
  display:flex;
  align-items:center;
  border-bottom:1px solid #c1aa6e45;
  background:var(--panel-deep);
  padding:0 24px;
  gap:36px
}
.wordmark {
  display:flex;
  align-items:center;
  gap:12px;
  width:230px;
  flex-shrink:0;
  font-family:var(--font-heading);
  font-size:12px;
  letter-spacing:2px
}
.wordmark>.icon {
  width:40px;
  height:40px
}
.wordmark span {
  display:block;
  font-size:23px;
  letter-spacing:4px;
  line-height:1.2
}
.hud-stats {
  display:flex;
  gap:34px
}
.hud-stats>div {
  display:flex;
  gap:10px;
  align-items:center
}
.hud-stats .icon {
  width:27px;
  height:27px
}
.hud-stats strong {
  display:block;
  font-size:24px;
  font-weight:500;
  font-variant-numeric:tabular-nums
}
.hud-stats small {
  display:block;
  font-size:8px;
  letter-spacing:1.2px;
  color:var(--muted)
}
.hud-stats small em {
  color:var(--gold);
  letter-spacing:0;
  margin-left:6px
}
.hud-stats i {
  font-size:13px;
  color:var(--muted)
}
.hud-controls {
  margin-left:auto;
  display:flex;
  gap:8px;
  align-items:center
}
.hud-controls>span {
  margin-right:14px;
  color:var(--gold)
}
.hud-controls button {
  padding:8px 10px
}
.hud-controls button .icon {
  width:16px;
  height:16px
}
.game-layout {
  display:grid;
  grid-template-columns:var(--sidebar-width) 1fr;
  height:calc(100dvh - var(--hud-height));
  min-height:650px
}
.sidebar {
  background:linear-gradient(120deg,var(--panel),#243b32);
  border-right:1px solid #b79d5d66;
  overflow:auto;
  display:flex;
  flex-direction:column
}
.side-header {
  padding:22px 22px 18px;
  border-bottom:1px solid var(--line)
}
.side-header strong {
  display:block;
  font-size:15px;
  margin-top:8px;
  font-family:var(--font-heading);
  font-weight:400
}
.node-summary {
  padding:22px 22px 17px
}
.node-summary h2 {
  font-size:25px;
  margin:8px 0 5px
}
.node-summary>p {
  color:var(--muted);
  font-size:11px
}
.node-stats {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:23px
}
.node-stats>div {
  display:grid;
  grid-template-columns:23px 1fr;
  align-items:center;
  gap:5px
}
.node-stats strong {
  font-size:25px;
  font-weight:500;
  white-space:nowrap
}
.node-stats i {
  font-size:12px;
  color:var(--muted)
}
.node-stats small {
  grid-column:1/-1;
  font-size:8px;
  letter-spacing:1px;
  color:var(--muted);
  margin-top:3px
}
.production-line {
  display:flex;
  justify-content:space-between;
  gap:8px;
  border-top:1px solid var(--line);
  padding-top:15px;
  margin-top:16px
}
.production-line>span {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px
}
.production-line .icon {
  width:16px;
  height:16px
}
.terrain-note {
  display:block;
  font-size:10px;
  line-height:1.6;
  margin-top:12px;
  color:var(--muted)
}
.upgrades,.orders {
  padding:17px 17px;
  border-top:1px solid var(--line)
}
.upgrade {
  width:100%;
  justify-content:flex-start;
  padding:11px 9px;
  margin-bottom:6px;
  background:#0d271f38
}
.upgrade>.icon {
  width:26px;
  height:26px
}
.upgrade>span {
  text-align:left;
  flex:1
}
.upgrade strong {
  display:block;
  font-weight:500;
  font-size:12px
}
.upgrade strong em {
  float:right;
  color:var(--muted);
  font-size:10px
}
.upgrade small {
  display:block;
  font-size:9px;
  color:var(--muted);
  margin-top:4px
}
.upgrade b {
  font-size:14px;
  min-width:38px;
  text-align:right;
  font-weight:400
}
.orders p {
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
  margin-bottom:12px
}
.orders button {
  font-size:10px;
  padding:7px 10px;
  min-height:32px
}
.orders small {
  display:block;
  margin:10px 0;
  color:var(--muted);
  font-size:10px
}
.orders .section-label span {
  margin-left:auto;
  font-size:9px;
  letter-spacing:0
}
.rivals {
  padding:18px 22px;
  border-top:1px solid var(--line)
}
.rival-row {
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:13px
}
.rival-dot {
  width:7px;
  height:7px;
  background:var(--rival);
  display:inline-block;
  transform:rotate(45deg);
  flex-shrink:0
}
.rival-row>div {
  flex:1
}
.rival-row strong {
  font-size:12px;
  font-weight:500
}
.rival-row small {
  display:block;
  color:var(--muted);
  font-size:9px;
  text-transform:capitalize;
  margin-top:3px
}
.rival-row b {
  font-weight:400;
  font-family:var(--font-army)
}
.rival-row b small {
  display:inline;
  font-family:var(--font-body);
  font-size:7px
}
.dispatches {
  padding:18px 22px;
  border-top:1px solid var(--line)
}
.dispatches p {
  font-size:10px;
  line-height:1.65;
  color:var(--muted);
  margin:8px 0
}
.dispatches time {
  color:var(--gold);
  font-family:var(--font-time);
  font-size:9px
}
.tools {
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  padding:15px 16px;
  margin-top:auto;
  border-top:1px solid var(--line)
}
.tools button {
  min-height:28px;
  font-size:9px;
  padding:5px 7px
}
.tools .icon {
  width:14px;
  height:14px
}
.empty-panel {
  padding:38px 23px
}
.empty-panel>.icon {
  width:55px;
  height:55px;
  margin-bottom:20px
}
.empty-panel p {
  font-size:12px;
  line-height:1.9;
  color:var(--muted);
  margin-top:15px
}
.war-table {
  min-width:0;
  background:var(--paper);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  background-image:radial-gradient(ellipse at 20% 50%,#bcbe9d35,transparent 65%),repeating-linear-gradient(94deg,#ffffff04 0px,#ffffff04 1px,transparent 1px,transparent 4px)
}
.map-heading {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:25px;
  padding:25px 30px 8px
}
.map-heading .eyebrow {
  color:#7b805f;
  font-size:8px
}
.map-heading h2 {
  margin-top:4px;
  font-size:27px
}
.map-heading>p {
  font-family:var(--font-heading);
  font-size:13px;
  font-style:italic;
  color:#68725d;
  margin-left:auto
}
.zoom {
  display:flex;
  gap:3px
}
.zoom button {
  color:var(--ink);
  border-color:#67745b40;
  min-height:28px;
  padding:3px 8px
}
.send-meter {
  min-width:180px;
  margin-left:auto
}
.meter-label {
  display:block;
  font-size:8px;
  font-weight:600;
  letter-spacing:1.3px;
  color:#65755b;
  margin-bottom:5px
}
.meter-notches {
  display:flex;
  border:1px solid #7d8b6b80;
  border-radius:4px;
  overflow:hidden;
  background:#f5f0e1
}
.meter-notches button {
  flex:1;
  min-height:30px;
  padding:5px 8px;
  font-size:10px;
  border:0;
  border-right:1px solid #7d8b6b50;
  border-radius:0;
  color:var(--ink)
}
.meter-notches button:last-child { border-right:0 }
.meter-notches button[aria-pressed=true] {
  background:#315e48;
  color:var(--cream);
  box-shadow:inset 0 -3px 0 var(--gold)
}
.meter-notches button:focus-visible { outline-offset:-3px }
.recipient-list {
  padding-left:22px;
  font-size:11px;
  line-height:1.8;
  color:var(--muted);
  margin:0 0 12px
}
.recipient-list strong { float:right; color:var(--gold); font-weight:500 }
.map-wrap {
  position:relative;
  flex:1;
  min-height:250px;
  overflow:hidden;
  touch-action:none
}
#battlefield {
  width:100%;
  height:100%;
  display:block;
  user-select:none
}
.roads line {
  stroke:#9f9f83;
  stroke-width:2;
  stroke-dasharray:5 5;
  opacity:.7
}
.landscape {
  pointer-events:none
}
.trees {
  fill:#849778;
  opacity:.32
}
.contour {
  stroke:#b2b398;
  fill:none;
  stroke-width:1
}
.region-label {
  font-family:var(--font-heading);
  font-size:12px;
  fill:#979b7c;
  letter-spacing:6px
}
.compass {
  fill:#9b9b79;
  font-family:var(--font-heading);
  font-size:12px
}
.map-node {
  cursor:pointer;
  outline:none
}
.node-disc {
  fill:#eee7d1;
  stroke:var(--owner);
  stroke-width:3
}
.node-shadow {
  fill:#3c463b19
}
.map-node image {
  filter:brightness(.53) saturate(.6);
  pointer-events:none
}
.king-ring {
  fill:none;
  stroke:#b78c40;
  stroke-width:2
}
.selection-ring,.target-ring {
  fill:none;
  stroke:transparent;
  stroke-width:2
}
.map-node.selected .selection-ring,.map-node:focus-visible .selection-ring {
  stroke:var(--selected)
}
.map-node.recipient .target-ring {
  stroke:var(--recipient)
}
.map-node.spell-target .selection-ring {
  stroke:#a583cd;
  stroke-width:3
}
.map-node.drop-target .target-ring { stroke:#315e48; stroke-width:4 }
.drag-order { pointer-events:none }
.drag-order path {
  stroke:#315e48;
  stroke-width:3;
  stroke-dasharray:7 4;
  vector-effect:non-scaling-stroke;
  fill:none
}
.drag-order text {
  font:600 16px var(--font-army);
  fill:var(--ink);
  paint-order:stroke;
  stroke:var(--cream);
  stroke-width:4px
}
.map-node:hover .node-disc {
  fill:#fff8e5;
  stroke-width:4
}
.army-badge {
  fill:var(--owner);
  stroke:#ece6d2;
  stroke-width:2
}
.army-number {
  font-family:var(--font-army);
  fill:#fff9e8;
  font-size:16px;
  font-weight:600
}
.hp-track {
  stroke:#c4c4ad;
  stroke-width:3;
  stroke-linecap:round
}
.hp-fill {
  stroke:#568f91;
  stroke-width:3;
  stroke-linecap:round
}
.node-name {
  font-family:var(--font-heading);
  font-size:12px;
  fill:#414f3f
}
.node-id {
  font-size:8px;
  fill:#81856c;
  letter-spacing:1px
}
.siege-label {
  fill:#a24435;
  font-size:8px;
  font-weight:600;
  letter-spacing:1px
}
.shield-ring {
  stroke:#86bed2;
  stroke-width:4;
  fill:none;
  opacity:.7
}
.order-lines path {
  stroke:#ae694f;
  stroke-width:1.5;
  stroke-dasharray:6 5;
  opacity:.8;
  fill:none;
  pointer-events:none
}
.armies {
  pointer-events:none
}
.armies text {
  font-family:var(--font-army);
  font-size:12px;
  fill:#1d392f;
  font-weight:600;
  paint-order:stroke;
  stroke:#eee5cc;
  stroke-width:3px
}
.map-instructions {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  min-height:38px;
  font-size:10px;
  letter-spacing:.1px;
  color:#6f755d;
  border-top:1px solid #64705920;
  background:#eeeadb88
}
.map-instructions strong {
  color:#395b48
}
.map-instructions button {
  min-height:27px;
  padding:3px 15px
}
.spell-dock {
  padding:14px 24px 21px;
  background:var(--panel-deep);
  color:var(--cream);
  border-top:3px solid #aa925d
}
.deck-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px
}
.deck-heading>span {
  display:flex;
  align-items:center;
  gap:9px;
  font-size:9px;
  letter-spacing:1.8px;
  color:var(--gold)
}
.deck-heading .icon {
  width:18px;
  height:18px
}
.deck-heading small {
  font-size:10px;
  color:var(--muted);
  font-family:var(--font-heading);
  font-style:italic
}
.spell-cards {
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:3px
}
.spell-card {
  position:relative;
  min-width:145px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:8px;
  border-color:#c5ad7840;
  background:#2c4136;
  padding:10px 10px 12px;
  overflow:hidden;
  align-items:stretch;
  text-align:left;
  border-radius:3px
}
.spell-card:disabled {
  opacity:.65
}
.spell-art {
  height:44px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(ellipse,#bca16a26,transparent 70%)
}
.spell-art>.icon {
  width:40px;
  height:40px
}
.spell-art>span {
  position:absolute;
  top:0;
  right:0;
  font-size:11px;
  border:1px solid #bfa36350;
  width:19px;
  height:21px;
  text-align:center;
  padding-top:3px;
  color:var(--gold)
}
.spell-card strong {
  font-size:11px;
  font-family:var(--font-heading);
  font-weight:400;
  display:block;
  white-space:nowrap
}
.spell-card small {
  font-size:7px;
  letter-spacing:.5px;
  display:block;
  margin-top:6px;
  color:var(--muted)
}
.spell-card.ready {
  border-color:var(--gold);
  background:#3b4e3c
}
.spell-card.ready small {
  color:var(--gold)
}
.research-fill {
  position:absolute;
  height:3px;
  bottom:0;
  left:0;
  background:var(--gold)
}
.modal-layer {
  position:fixed;
  inset:0;
  background:#102c27c9;
  backdrop-filter:blur(7px);
  display:grid;
  place-items:center;
  padding:25px;
  z-index:30;
  overflow:auto
}
.modal-layer[hidden] {
  display:none
}
.setup {
  display:grid;
  grid-template-columns:300px minmax(480px,650px);
  width:min(100%,950px);
  box-shadow:0 35px 120px #06150ee0;
  border:1px solid #c7ae7070;
  border-radius:6px;
  overflow:hidden;
  max-height:calc(100dvh - 50px);
  background:var(--panel)
}
.setup-art {
  padding:42px 25px;
  text-align:center;
  position:relative;
  background:radial-gradient(ellipse at center,#395948,#1d392f 80%);
  border-right:1px solid #c7ae7040;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}
.brand-seal {
  border:1px solid #c7ae7070;
  border-radius:50%;
  width:85px;
  height:85px;
  display:grid;
  place-items:center;
  margin-bottom:30px;
  outline:1px solid #c7ae7030;
  outline-offset:7px
}
.brand-seal .icon {
  width:56px;
  height:56px
}
.setup-art>.eyebrow {
  font-size:8px;
  letter-spacing:2px
}
.setup-art h1 {
  font-size:39px;
  line-height:1.1;
  margin-top:20px
}
.setup-art h1 em {
  color:var(--gold);
  display:inline-block;
  font-size:47px;
  margin-top:5px
}
.rule-ornament {
  color:var(--gold);
  margin:22px 0;
  font-size:12px;
  width:140px;
  display:flex;
  gap:10px;
  align-items:center
}
.rule-ornament:before,.rule-ornament:after {
  content:'';
  height:1px;
  background:#d6b87950;
  flex:1
}
.setup-art>p:not(.eyebrow) {
  font-family:var(--font-heading);
  font-size:15px;
  line-height:1.85;
  color:#bccab6;
  font-style:italic
}
.art-landscape {
  display:flex;
  align-items:flex-end;
  margin-top:30px;
  opacity:.6
}
.art-landscape .icon {
  width:60px;
  height:60px
}
.art-landscape .icon:nth-child(2) {
  width:95px;
  height:110px
}
.edition {
  font-size:7px;
  letter-spacing:1.5px;
  color:#91a38c;
  margin-top:24px
}
.setup-options {
  padding:30px 34px;
  background:#f0ead9;
  color:var(--ink);
  overflow-y:auto
}
.setup-options header {
  margin-bottom:22px
}
.setup-options header .eyebrow {
  color:#8c865b
}
.setup-options h2 {
  font-size:29px;
  margin:8px 0
}
.setup-options header p {
  font-size:11px;
  color:#7f846e
}
.setup-options .section-label {
  color:#68755c;
  margin-top:19px;
  font-size:9px;
  letter-spacing:1.2px
}
.setup-options .section-label>span {
  color:#9a8757
}
.choice {
  border:1px solid #80907a40;
  border-radius:4px;
  padding:13px;
  cursor:pointer;
  position:relative;
  background:#fff9;
  transition:.15s
}
.choice input {
  position:absolute;
  inset:0;
  opacity:0;
  width:100%;
  height:100%;
  margin:0;
  cursor:pointer
}
.choice:has(input:checked) {
  background:#dce4d5;
  border-color:#577d5d;
  box-shadow:inset 0 0 0 1px #577d5d40
}
.choice:has(input:focus-visible) {
  outline:2px solid #538cba;
  outline-offset:2px
}
.choice .icon {
  filter:brightness(.6) saturate(.5)
}
.mode-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.mode-choice {
  display:flex;
  gap:10px;
  align-items:center;
  min-height:73px
}
.mode-choice .icon {
  width:31px;
  height:31px
}
.mode-choice strong {
  font-family:var(--font-heading);
  font-size:16px;
  font-weight:400
}
.mode-choice small {
  display:block;
  font-size:9px;
  color:#7c846e;
  line-height:1.5;
  margin-top:3px
}
.faction-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px
}
.faction-choice {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:13px 3px
}
.faction-choice .icon {
  width:36px;
  height:36px
}
.faction-choice strong {
  font-family:var(--font-heading);
  font-size:16px;
  font-weight:400
}
.faction-choice small {
  font-size:8px;
  color:#7c846e
}
.faction-note {
  font-size:9px;
  color:#687c5c;
  margin-top:10px;
  text-align:center;
  min-height:12px
}
select,input {
  border:1px solid #7e8b7140;
  background:#fff9;
  padding:8px 10px;
  color:#2a4337;
  border-radius:3px;
  min-width:0;
  font-size:11px
}
.section-label select {
  margin-left:auto;
  padding:5px 7px;
  font-size:10px
}
.bot-row {
  display:flex;
  align-items:center;
  gap:10px;
  margin:8px 0
}
.bot-row strong {
  font-size:10px;
  font-weight:500;
  margin-right:auto
}
.bot-row select {
  width:125px
}
.setup-bottom {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:19px
}
.setup-bottom label {
  font-size:9px;
  color:#68755c;
  display:flex;
  flex-direction:column;
  gap:7px
}
.setup-start {
  margin-top:23px
}
.setup-start button {
  width:100%;
  background:#315e48;
  border-color:#315e48;
  color:#f4ead3;
  height:43px;
  font-size:13px
}
.setup-start button.primary .icon {
  filter:none
}
.setup-start small {
  display:block;
  text-align:center;
  font-size:9px;
  color:#7a816d;
  margin-top:11px
}
.dialog {
  width:min(670px,100%);
  max-height:90dvh;
  overflow:auto;
  background:var(--panel);
  border:1px solid #c7ae7060;
  box-shadow:0 30px 90px #081710a0;
  padding:32px;
  border-radius:6px
}
.dialog header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}
.dialog header button {
  min-height:30px;
  padding:3px 10px
}
.dialog p {
  line-height:1.8;
  color:#bdc9b7;
  font-size:12px;
  margin:14px 0
}
.dialog h3 {
  font-size:21px;
  color:var(--gold);
  margin-top:20px
}
.dialog ul {
  padding-left:18px;
  color:#bdc9b7;
  line-height:1.9;
  font-size:12px
}
.dialog a {
  color:var(--gold)
}
.spell-preview {
  text-align:center;
  max-width:430px
}
.spell-preview>.icon {
  width:100px;
  height:100px;
  margin:10px auto 20px
}
.spell-preview h2 {
  color:var(--gold)
}
.spell-preview button.primary {
  margin-top:12px;
  width:100%
}
.spell-preview.cast-away {
  animation:dissolve .35s forwards
}
@keyframes dissolve {
  to {
    opacity:0;
    filter:blur(15px);
    transform:scale(1.08)
  }
}
.asset-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}
.asset-slot {
  border:1px solid var(--line);
  padding:10px;
  display:flex;
  align-items:center;
  flex-direction:column;
  gap:7px
}
.asset-slot>.icon {
  width:40px;
  height:40px
}
.asset-slot label {
  display:inline-block;
  font-size:10px;
  cursor:pointer;
  color:var(--gold);
  border:1px solid #d6b87960;
  padding:5px 8px
}
.asset-slot input {
  display:none
}
.asset-slot button {
  font-size:9px;
  min-height:22px;
  padding:3px 7px
}
.upgrade-menu {
  position:absolute;
  top:12px;
  right:12px;
  z-index:5;
  background:var(--panel);
  color:var(--cream);
  padding:12px;
  width:min(255px,calc(100% - 24px));
  max-height:calc(100% - 24px);
  overflow:auto;
  box-shadow:0 12px 35px #253c3950;
  border:1px solid var(--gold);
  border-radius:4px
}
.upgrade-menu .section-label {
  margin-bottom:7px
}
.upgrade-menu>small { display:block; margin-bottom:10px; color:var(--gold) }
.upgrade-menu[hidden] {
  display:none
}
#toast {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#183c32;
  color:var(--cream);
  border:1px solid var(--gold);
  padding:11px 20px;
  font-size:12px;
  z-index:60;
  box-shadow:0 5px 25px #0003;
  pointer-events:none;
  opacity:0;
  transition:opacity .2s;
  max-width:90vw
}
#toast.visible {
  opacity:1
}
#reference {
  position:fixed;
  left:20px;
  bottom:20px;
  padding:12px;
  background:#f7e8ae;
  color:#223d32;
  border:1px solid #b99141;
  font:12px monospace;
  pointer-events:none;
  z-index:100
}
.inspecting [data-ui]:hover {
  outline:2px dashed #e9b745!important
}
#pause-banner {
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:#234f40ed;
  color:var(--gold);
  border:1px solid var(--gold);
  padding:12px 25px;
  font-size:11px;
  letter-spacing:2px;
  pointer-events:none
}
.result {
  text-align:center
}
.result>.icon {
  height:100px;
  width:100px;
  margin:15px
}
.result h2 {
  font-size:40px;
  color:var(--gold)
}
.result button {
  margin:10px
}
.result-stats {
  display:flex;
  justify-content:center;
  gap:25px;
  margin:20px 0
}
.result-stats strong {
  display:block;
  font-size:23px;
  font-family:var(--font-heading)
}
.result-stats small {
  color:var(--muted);
  letter-spacing:1px
}

"src/core/map.js":function(require){
const { random } = require("src/core/random.js");
const { BALANCE : B, RULES } = require("src/content/balance.js");
const { UPGRADES } = require("src/content/upgrades.js");
const names = ['Alderwatch', 'Briar Hollow', 'Stoneford', 'Thornfield', 'Ashen Mill', 'Oakrest', 'Windmere', 'Highfell', 'Greybridge', 'Foxglove', 'Ember Hill', 'Westhaven', 'Dawnreach', 'Ironwood', 'Mossgate', 'Redbrook', 'Kingsfall', 'Silverfen', 'Rookwell', 'Fallowmere'];
/** Irregular grid guarantees connected, readable, bounded-degree maps. */
function generateMap(players, perPlayer, seed) {
  const rng = random(seed), count = players * perPlayer;
  const rows = count <= 24 ? 3 : count <= 48 ? 4 : 5, cols = Math.ceil(count / rows);
  const nodes = Array.from({ length: count }, (_, i) => ({
    id: i, label: `N${String(i + 1).padStart(2, '0')}`, name: names[i % names.length],
    x: 100 + (i % cols) * 170 + (rng() - .5) * 35, y: 110 + Math.floor(i / cols) * 160 + (rng() - .5) * 38,
    type: 'regular', owner: null, king: null, tiers: { gold: 1, barracks: 0, hp: 1 }, hp: 0, army: 0,
    routes: [], routeCursor: 0, goldElapsed: 0, goldDuration: UPGRADES.gold.values[1], troopElapsed: 0, troopDuration: RULES.troopSeconds,
    cyclePower: 1, troopRunning: false, lastDamage: -100, effects: {},
  }));
  const edges = [];
  for (let i = 0; i < count; i++) {
    if (i % cols < cols - 1 && i + 1 < count) edges.push([i, i + 1]);
    if (i + cols < count) edges.push([i, i + cols]);
  }
  // A short final row is linked back horizontally; its endpoints still have degree >= 2.
  if (count % cols === 1) edges.push([count - 1, count - 2]);
  const kings = [Math.floor(rows / 2) * cols];
  while (kings.length < players) {
    const candidates = nodes.filter(n => !kings.includes(n.id));
    candidates.sort((a, b) => Math.min(...kings.map(k => Math.hypot(nodes[k].x - b.x, nodes[k].y - b.y))) - Math.min(...kings.map(k => Math.hypot(nodes[k].x - a.x, nodes[k].y - a.y))));
    kings.push(candidates[0].id);
  }
  const neutral = nodes.filter(n => !kings.includes(n.id));
  const shuffled = [...neutral].sort(() => rng() - .5);
  const specials = Math.max(1, Math.floor(neutral.length / 8));
  for (let i = 0; i < specials; i++) shuffled[i].type = i % 2 ? 'river' : 'mountain';
  for (const n of neutral) {
    for (let i = 0; i < 2; i++) if (rng() < .25) n.tiers[rng() < .5 ? 'gold' : 'hp']++;
    if (rng() < .25) n.tiers.barracks = 1;
    const distance = Math.min(...kings.map(k => Math.abs(k % cols - n.id % cols) + Math.abs(Math.floor(k / cols) - Math.floor(n.id / cols))));
    n.army = B.neutralBase + distance * B.neutralDistance + (n.tiers.gold + n.tiers.hp + n.tiers.barracks - 2) * B.neutralUpgrade;
  }
  kings.forEach((id, p) => Object.assign(nodes[id], { owner: p, king: p, name: ['Verdant Keep', 'Ironhold', 'Redwatch', 'Amber Crown', 'Violet Bastion'][p], tiers: { gold: 1, barracks: 1, hp: 2 }, hp: UPGRADES.hp.values[2], army: B.startingArmy, troopRunning: true }));
  return { nodes, edges, width: 200 + (cols - 1) * 170, height: 220 + (rows - 1) * 160 };
}

return {generateMap};
},
"src/core/random.js":function(require){
function random(seed) {
  let x = 2166136261;
  for (const c of String(seed)) x = Math.imul(x ^ c.charCodeAt(0), 16777619);
  return () => { x += 0x6D2B79F5; let t = Math.imul(x ^ x >>> 15, 1 | x); t ^= t + Math.imul(t ^ t >>> 7, 61 | t); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

return {random};
},

"src/core/engine.js":function(require){
const { economyStep } = require("src/core/economy.js");
const { researchStep } = require("src/core/spells.js");
const { arrive, checkVictory } = require("src/core/combat.js");
const { edgeDuration, ordersStep } = require("src/core/routing.js");
const { aiStep } = require("src/core/ai.js");
/** Pure simulation entry point: no DOM, wall clock, network or storage. */
function step(g, dt, bots = true) {
  if (g.result) return;
  g.time += dt; economyStep(g, dt);
  for (const w of [...g.waves]) {
    w.elapsed += dt;
    if (w.elapsed + 1e-8 < w.duration) continue;
    const next = g.nodes[w.path[w.leg + 1]];
    if (next.owner !== w.owner || w.leg + 1 === w.path.length - 1) {
      arrive(g, next, w.owner, w.power); g.waves = g.waves.filter(x => x.id !== w.id);
    } else { w.elapsed -= w.duration; w.leg++; w.duration = edgeDuration(g, w.path[w.leg], w.path[w.leg + 1]); }
  }
  researchStep(g, dt); checkVictory(g);
  if (!g.result) { ordersStep(g); if (bots) aiStep(g); }
}

return {step};
},
"src/core/economy.js":function(require){
const { maxHp, upgradeCost, troopDuration, atPeace } = require("src/core/selectors.js");
const { UPGRADES } = require("src/content/upgrades.js");
const { BALANCE : B } = require("src/content/balance.js");
/** Upgrades change the next cycle, never the snapshot of the active cycle. */
function upgrade(g, nodeId, key, owner, free = false) {
  const n = g.nodes[nodeId];
  if (!n || n.owner !== owner || !UPGRADES[key]) return false;
  const cost = upgradeCost(g, n, key);
  if (!Number.isFinite(cost) || (!free && g.players[owner].gold + 1e-8 < cost)) return false;
  if (!free) g.players[owner].gold -= cost;
  n.tiers[key]++;
  return true;
}
function economyStep(g, dt) {
  for (const n of g.nodes) {
    if (n.owner === null) continue;
    n.goldElapsed += dt;
    while (n.goldElapsed + 1e-8 >= n.goldDuration) {
      n.goldElapsed -= n.goldDuration;
      const recipient = n.effects.theft?.until > g.time ? n.effects.theft.owner : n.owner;
      g.players[recipient].gold += 1; n.goldDuration = UPGRADES.gold.values[n.tiers.gold];
    }
    const peaceful = atPeace(g, n);
    if (peaceful) n.hp = Math.min(maxHp(n), n.hp + B.regeneration * dt);
    if (n.tiers.barracks && !n.troopRunning && peaceful) {
      n.troopRunning = true; n.troopElapsed = 0; n.troopDuration = troopDuration(g, n); n.cyclePower = UPGRADES.barracks.values[n.tiers.barracks];
    }
    if (n.troopRunning) {
      n.troopElapsed += dt;
      if (n.troopElapsed + 1e-8 >= n.troopDuration) {

const { SPELLS } = require("src/content/spells.js");
const { BALANCE : B } = require("src/content/balance.js");
const { owned, atPeace, faction, maxHp } = require("src/core/selectors.js");
const { upgrade } = require("src/core/economy.js");
const { damage } = require("src/core/combat.js");
const { event } = require("src/core/state.js");

function research(g, p, id) {

}
function researchStep(g, dt) {

      n = eligibleLabs(g, p.id, SPELLS[job.id]).find(n => !p.research.some(j => j !== job && j.node === n.id));
      if (!n) { p.research = p.research.filter(j => j !== job); event(g, `${p.name}: ${SPELLS[job.id].name} research lost.`); continue; }
      job.node = n.id;
    }
    if (atPeace(g, n)) job.elapsed += dt;
    if (job.elapsed + 1e-8 >= job.duration) { p.hand.push(job.id); p.research = p.research.filter(j => j !== job); event(g, `${p.name}: ${SPELLS[job.id].name} is ready.`, 'magic'); }
  }
}
function validTargets(g, p, id, ids) {
  const s = SPELLS[id]; if (!s || new Set(ids).size !== ids.length) return false;
  const ns = ids.map(i => g.nodes[i]);
  if (ns.some(n => !n || n.owner === null)) return false;
  const own = ns.filter(n => n.owner === p).length;
  return ({ none: ids.length === 0, own: ids.length === 1 && own === 1, enemy: ids.length === 1 && own === 0,
    twoOwn: ids.length === 2 && own === 2, twoAny: ids.length === 2, mixed: ids.length === 2 && own === 1,
    allOwn: ids.length > 0 && own === ids.length })[s.target] ?? false;
}
/** Each effect is isolated. New spells supply a definition and one handler. */
const EFFECTS = {
  teleport(g, p, [a, b]) { const amount = Math.floor(a.army / 2); a.army -= amount; b.army += amount; },
  regrowth(g, p, [n]) { n.hp = Math.min(maxHp(n), n.hp + maxHp(n) / 2); },
  leyline(g, p, [a, b]) { if (!g.edges.some(([x, y]) => x === a.id && y === b.id || x === b.id && y === a.id)) g.edges.push([a.id, b.id]); },
  illusion(g, p, ns) { ns.forEach(n => n.effects.hidden = g.time + B.illusionSeconds); },
  devastation(g, p, [n]) { if (n.effects.shield > g.time) return; n.army /= 2; n.hp /= 2; n.lastDamage = g.time; },
  mines(g, p) { g.players[p].gold *= 1 + B.mineBonus; },
  bastion(g, p, [n]) { for (const key of ['hp', 'gold']) if (!upgrade(g, n.id, key, p, true)) n.army += 10; },
  defense(g, p, [n]) { n.effects.shield = g.time + 5; },
  gear(g, p, ns) { ns.forEach(n => { n.army *= 1 + B.gearBonus; }); },
  catapult(g, p, ns) { const source = ns.find(n => n.owner === p), amount = source.army / 4; ns.forEach(n => damage(g, n, amount)); },
  treasures(g, p, [n]) { n.effects.theft = { owner: p, until: g.time + 10 }; },
  heat(g, p, ns) { ns.forEach(n => n.effects.haste = { factor: B.hasteSpeed, until: g.time + B.hasteSeconds }); },

function cast(g, p, id, ids) {

  event(g, `${g.players[p].name} cast ${SPELLS[id].name}.`, 'magic'); return true;
}

return {eligibleLabs,research,researchStep,validTargets,EFFECTS,cast};
},

"src/core/combat.js":function(require){
const { maxHp, owned, troopDuration } = require("src/core/selectors.js");
const { RULES } = require("src/content/balance.js");
const { UPGRADES } = require("src/content/upgrades.js");
const { event } = require("src/core/state.js");
function damage(g, n, amount) {
  if (amount <= 0 || n.effects.shield > g.time) return 0;
  n.lastDamage = g.time;
  const shield = Math.min(n.army, amount); n.army -= shield; amount -= shield;
  const wall = Math.min(n.hp, amount); n.hp -= wall; amount -= wall;
  return amount;
}
function capture(g, n, owner, army) {

  n.routes = []; n.routeCursor = 0; n.effects = {}; n.lastDamage = g.time; n.goldElapsed = 0; n.troopElapsed = 0;
  n.goldDuration = UPGRADES.gold.values[n.tiers.gold]; n.troopDuration = troopDuration(g, n);
  n.cyclePower = UPGRADES.barracks.values[n.tiers.barracks]; n.troopRunning = false;
  g.captures++; event(g, `${g.players[owner].name} captured ${n.name}.`, 'capture');
  if (g.config.mode === 'conquest' && n.king !== null && n.king !== owner && g.players[n.king].alive) {
    const loser = n.king; g.players[loser].alive = false; g.players[loser].research = []; g.players[loser].hand = [];
    for (const territory of owned(g, loser)) capture(g, territory, owner, territory.army);
    for (const wave of g.waves) if (wave.owner === loser) wave.owner = owner;

  }

}

  const remaining = damage(g, n, power);

}
function checkVictory(g) {

  if (g.config.mode === 'conquest') {
    if (!g.players[0].alive) g.result = 'defeat';
    else if (g.nodes.filter(n => n.king !== null).every(n => n.owner === 0)) g.result = 'victory';
  } else {
    for (const p of g.players) if (!owned(g, p.id).length) {
      p.alive = false;
      p.research = [];
      p.hand = [];
      g.waves = g.waves.filter(w => w.owner !== p.id);
    }
    if (!g.players[0].alive) g.result = 'defeat';
    else if (g.nodes.every(n => n.owner === 0)) g.result = 'victory';
  }

return {damage,capture,arrive,checkVictory};
},
"src/core/routing.js":function(require){
const { neighbors } = require("src/core/selectors.js");
const { NODE_TYPES } = require("src/content/node-types.js");
const { RULES, SEND_PERCENTAGES } = require("src/content/balance.js");
const edgeDuration = (g, a, b) => RULES.edgeSeconds / Math.min(NODE_TYPES[g.nodes[a].type].speed, NODE_TYPES[g.nodes[b].type].speed);
/** Dijkstra: only friendly interior nodes; endpoint may be hostile. */

  if (from === to || g.nodes[from]?.owner !== owner || !g.nodes[to]) return null;
  const distance = new Map([[from, 0]]), previous = new Map(), open = new Set([from]);
  while (open.size) {
    const current = [...open].sort((a, b) => distance.get(a) - distance.get(b))[0]; open.delete(current);
    if (current === to) { const path = [to]; while (path[0] !== from) path.unshift(previous.get(path[0])); return path; }
    if (current !== from && g.nodes[current].owner !== owner) continue;
    for (const next of neighbors(g, current)) {
      const d = distance.get(current) + edgeDuration(g, current, next);
      if (d < (distance.get(next) ?? Infinity)) { distance.set(next, d); previous.set(next, current); open.add(next); }
    }
  }
  return null;
}
function commitRoutes(g, nodeId, recipients, owner) {
  const n = g.nodes[nodeId];
  if (!n || n.owner !== owner || owner === null || g.result) return false;
  const previous = n.routes, cursor = n.routeCursor;
  const nextInOrder = [...previous.slice(cursor), ...previous.slice(0, cursor)].map(r => r.to);
  const routes = [];
  for (const recipient of recipients) {
    const { to, percent = 100 } = typeof recipient === 'number' ? { to: recipient } : recipient;
    if (!SEND_PERCENTAGES.includes(percent) || routes.some(r => r.to === to)) continue;
    const existing = previous.find(r => r.to === to);
    if (!existing && !findPath(g, nodeId, to, owner)) continue;
    routes.push({ to, percent, nextSend: existing?.percent === percent ? existing.nextSend : g.time + RULES.orderDelay });
  }
  n.routes = routes;
  const next = nextInOrder.find(to => routes.some(r => r.to === to));
  n.routeCursor = Math.max(0, routes.findIndex(r => r.to === next));

  g.waves.push({ id: g.nextWave++, owner: n.owner, power, path, leg: 0, elapsed: 0, duration: edgeDuration(g, path[0], path[1]), created: g.time });

      if (!path) { n.routeCursor = (n.routeCursor + 1) % n.routes.length; continue; }
      if (!send(g, n, path, route.percent)) break;
      route.nextSend = g.time + RULES.sendSeconds;
      n.routeCursor = (n.routeCursor + 1) % n.routes.length;
    }
  }
}

},
"src/core/ai.js":function(require){
const { owned, neighbors, maxHp } = require("src/core/selectors.js");
const { commitRoutes, findPath } = require("src/core/routing.js");
const { upgrade } = require("src/core/economy.js");
const { SPELLS } = require("src/content/spells.js");
const { research, cast } = require("src/core/spells.js");
const DIFFICULTIES = {
  easy: { interval: 5, actions: 1, caution: 1.6, foresight: 0 },
  normal: { interval: 2.8, actions: 2, caution: 1.25, foresight: 1 },
  hard: { interval: 1.5, actions: 3, caution: 1.1, foresight: 2 },
  nightmare: { interval: .65, actions: 4, caution: 1.02, foresight: 3 },
};
// Illusions change observations, never the underlying combat state.
const observed = (g, n) => n.effects.hidden > g.time ? 12 : n.army;
function spellTargets(g, p, s, ns) {
  const foes = g.nodes.filter(n => n.owner !== null && n.owner !== p.id).sort((a, b) => observed(g, b) - observed(g, a));
  const strong = [...ns].sort((a, b) => b.army - a.army);
  const hurt = [...ns].sort((a, b) => a.hp / maxHp(a) - b.hp / maxHp(b));
  switch (s.target) {
    case 'none': return [];
    case 'own': return [(s.id === 'regrowth' || s.id === 'defense' ? hurt : strong)[0]?.id];
    case 'enemy': return [foes[0]?.id];
    case 'allOwn': return ns.map(n => n.id);
    case 'twoOwn': return strong.slice(0, 2).map(n => n.id);
    case 'twoAny': return [strong[0]?.id, foes[0]?.id];
    case 'mixed': return [strong[0]?.id, foes[0]?.id];
  }

function act(g, p, d) {
  const ns = owned(g, p.id); if (!ns.length) return false;
  for (const id of p.hand) if (cast(g, p.id, id, spellTargets(g, p, SPELLS[id], ns))) return true;
  const king = ns.find(n => n.king === p.id) || ns[0];
  const incoming = g.waves.filter(w => w.owner !== p.id && g.nodes[w.path.at(-1)].owner === p.id);
  if (d.foresight && incoming.length) {
    const target = g.nodes[incoming[0].path.at(-1)];
    const donor = ns.filter(n => n !== target && n.army > 4 && findPath(g, n.id, target.id, p.id)).sort((a, b) => b.army - a.army)[0];
    if (donor && !donor.routes.some(r => r.to === target.id)) return commitRoutes(g, donor.id, [target.id], p.id);
  }
  const frontier = g.nodes.filter(n => n.owner !== p.id && neighbors(g, n.id).some(i => g.nodes[i].owner === p.id));
  const force = ns.reduce((a, n) => a + n.army, 0);
  const targets = frontier.map(n => ({ n, cost: observed(g, n) + n.hp,
    score: observed(g, n) + n.hp - (n.king !== null ? d.foresight * 8 : 0) - (n.owner !== null && g.players[n.owner].faction === 'dwarves' ? d.foresight * 2 : 0),
  })).sort((a, b) => a.score - b.score);
  const target = targets.find(t => force > t.cost * d.caution + 2);
  if (target) {
    const donor = [...ns].sort((a, b) => b.army - a.army).find(n => n.army >= 2 && !n.routes.some(r => r.to === target.n.id) && findPath(g, n.id, target.n.id, p.id));

  }
  // Faction biases are explicit and editable, not hidden resource bonuses.
  const order = p.faction === 'goblins' ? ['barracks', 'gold', 'hp'] : p.faction === 'elves' ? ['gold', 'barracks', 'hp'] : ['barracks', 'hp', 'gold'];
  if (p.faction === 'elves' || g.time > 35) for (const s of Object.values(SPELLS).filter(s => s.faction === p.faction)) if (research(g, p.id, s.id)) return true;
  for (const key of order) {
    const candidates = [king, ...ns.filter(n => n !== king).sort((a, b) => a.tiers[key] - b.tiers[key])];
    for (const n of candidates) if (upgrade(g, n.id, key, p.id)) return true;
  }
  return false;
}
function aiStep(g) {
  for (const p of g.players.slice(1)) {
    if (!p.alive || p.nextThink > g.time) continue;
    const d = DIFFICULTIES[p.difficulty]; p.nextThink = g.time + d.interval;
    for (let i = 0; i < d.actions; i++) if (!act(g, p, d)) break;
  }
}

return {DIFFICULTIES,aiStep};
},

"src/ui/dom.js":function(require){
/** Small DOM reconciler: preserve button/input identity during live stat updates. */
function renderInto(root, html) {
  const template = document.createElement('template'); template.innerHTML = html;
  reconcile(root, template.content);
}
function reconcile(old, fresh) {
  for (let i = 0; i < fresh.childNodes.length; i++) {
    const next = fresh.childNodes[i], current = old.childNodes[i];
    if (!current) { old.append(next.cloneNode(true)); continue; }
    if (current.nodeType !== next.nodeType || current.nodeName !== next.nodeName) { current.replaceWith(next.cloneNode(true)); continue; }
    if (next.nodeType === 3) { if (current.textContent !== next.textContent) current.textContent = next.textContent; continue; }
    if (next.nodeType !== 1) continue;
    for (const attr of [...current.attributes]) if (!next.hasAttribute(attr.name)) current.removeAttribute(attr.name);
    for (const attr of next.attributes) if (current.getAttribute(attr.name) !== attr.value) current.setAttribute(attr.name, attr.value);
    reconcile(current, next);
  }
  while (old.childNodes.length > fresh.childNodes.length) old.lastChild.remove();
}

return {renderInto};
},
"src/ui/feedback.js":function(require){
/** Short-lived cast animation. A visual copy cannot receive input or retain IDs. */
function dissolveCard(id) {
  const card = document.querySelector(`[data-ui="spell.${id}"]`);
  if (!card) return;
  const rect = card.getBoundingClientRect(), ghost = card.cloneNode(true);
  ghost.removeAttribute('data-action'); ghost.removeAttribute('data-ui');
  ghost.setAttribute('aria-hidden', 'true'); ghost.tabIndex = -1;
  ghost.classList.add('cast-echo');
  Object.assign(ghost.style, { left: `${rect.left}px`, top: `${rect.top}px`, width: `${rect.width}px`, height: `${rect.height}px` });
  document.body.append(ghost); setTimeout(() => ghost.remove(), 520);
}

return {dissolveCard};
},

"src/ui/battlefield.js":function(require){
const { asset } = require("src/ui/assets.js");
const { maxHp } = require("src/core/selectors.js");
const { NODE_TYPES } = require("src/content/node-types.js");
const { random } = require("src/core/random.js");
const { fmt, escape } = require("src/ui/components.js");
const img = (id, x, y, width, height = width) => `<image href="${escape(asset(id))}" x="${x}" y="${y}" width="${width}" height="${height}"/>`;
function terrain(g) {
  const rng = random(g.config.seed + 'land'); let trees = '';
  for (let i = 0; i < 240; i++) {
    const x = rng() * g.width, y = rng() * g.height;
    if (g.nodes.some(n => Math.hypot(n.x - x, n.y - y) < 65)) continue;
    const s = .5 + rng() * .8;
    trees += `<path transform="translate(${x} ${y}) scale(${s})" d="M0 0l-7 13h4l-7 9h8v5h4v-5h8l-7-9h4z"/>`;
  }
  return `<g class="landscape" aria-hidden="true"><path class="contour" d="M0 80Q${g.width/3} -70 ${g.width/2} 80T${g.width} 60M0 ${g.height-30}Q${g.width/2} ${g.height-130} ${g.width} ${g.height-10}"/><g class="trees">${trees}</g><text class="region-label" x="${g.width*.52}" y="30" text-anchor="middle">THE BORDERLANDS</text><text class="region-label" x="${g.width*.52}" y="${g.height-10}" text-anchor="middle">THE OLD KINGDOM</text><g class="compass" transform="translate(${g.width-40} ${g.height-55})"><path d="M0-24L5 0 0 24-5 0zM-20 0L0-4 20 0 0 4z"/><text y="-30" text-anchor="middle">N</text></g></g>`;
}
function battlefieldView(g, ui) {
  const selected = [...ui.selected], common = selected.length ? g.nodes[selected[0]].routes.filter(r => selected.every(s => g.nodes[s].routes.some(other => other.to === r.to))).map(r => r.to) : [];
  return `<g id="land">${ui.terrain}</g><g class="roads">${g.edges.map(([a,b])=>`<line x1="${g.nodes[a].x}" y1="${g.nodes[a].y}" x2="${g.nodes[b].x}" y2="${g.nodes[b].y}"/>`).join('')}</g>
  <g class="order-lines">${selected.flatMap(id => g.nodes[id].routes.map(r=>`<path d="M${g.nodes[id].x} ${g.nodes[id].y}L${g.nodes[r.to].x} ${g.nodes[r.to].y}"/>`)).join('')}</g>
  <g>${g.nodes.map(n => {
    const color = n.owner === null ? '#92917a' : g.players[n.owner].color, picked = ui.selected.has(n.id), target = ui.targets.includes(n.id), hidden = n.owner !== 0 && n.effects.hidden > g.time;
    return `<g class="map-node ${picked ? 'selected' : ''} ${common.includes(n.id) ? 'recipient' : ''} ${target ? 'spell-target' : ''} ${ui.dragOrder?.to===n.id ? 'drop-target' : ''}" transform="translate(${n.x} ${n.y})" data-node="${n.id}" data-ui="map.node.${n.label}" tabindex="0" role="button" aria-label="${escape(n.name)}, ${n.owner === null ? 'vacant' : g.players[n.owner].name}, ${hidden ? 'hidden' : fmt(n.army)} army, ${fmt(n.hp)} health" style="--owner:${color}">
    <title>${n.label} · ${n.name} · ${NODE_TYPES[n.type].name}\nArmy ${hidden ? '?' : fmt(n.army)} · HP ${fmt(n.hp)} / ${fmt(maxHp(n))}\n${n.owner === 0 ? 'Left: select and upgrade. Drag: send once. Right: toggle recipient.' : 'Drop troops here, or right-click to toggle recipient.'}</title>
    <circle class="node-shadow" r="32" cy="3"/><circle class="king-ring" r="37" ${n.king === null ? 'visibility="hidden"' : ''}/><circle class="selection-ring" r="41"/><circle class="target-ring" r="44"/><circle class="node-disc" r="29"/>
    ${img(n.king !== null ? 'crown' : NODE_TYPES[n.type].icon, -20,-24,40)}
    <rect class="army-badge" x="-23" y="14" width="46" height="24" rx="9"/><text class="army-number" text-anchor="middle" y="31" data-ui="map.node.${n.label}.army">${hidden ? '?' : fmt(n.army)}</text>
    <path class="hp-track" d="M-22 43H22"/><path class="hp-fill" d="M-22 43H${-22+44*n.hp/maxHp(n)}"/>
    <text class="node-name" text-anchor="middle" y="59">${escape(n.name)}</text><text class="node-id" text-anchor="middle" y="73">${n.label}${n.king !== null ? ' · KING' : ''}</text>
    ${n.effects.shield > g.time ? '<circle class="shield-ring" r="33"/>' : ''}
    ${g.time-n.lastDamage < 5 && n.owner !== null ? '<text class="siege-label" y="-47" text-anchor="middle">UNDER SIEGE</text>' : ''}
    </g>`;
  }).join('')}</g><g class="armies" aria-hidden="true">${g.waves.map(w=>{
    const a=g.nodes[w.path[w.leg]],b=g.nodes[w.path[w.leg+1]],t=Math.min(1,w.elapsed/w.duration),x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;

  }).join('')}</g><g class="drag-order" aria-hidden="true">${ui.dragOrder?`<path d="M${g.nodes[ui.dragOrder.from].x} ${g.nodes[ui.dragOrder.from].y}L${ui.dragOrder.x} ${ui.dragOrder.y}"/><text x="${ui.dragOrder.x+15}" y="${ui.dragOrder.y-15}">${ui.percent}%</text>`:''}</g>`;
}

return {terrain,battlefieldView};
},
